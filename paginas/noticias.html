
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Notícias | EmygerfsonNoticias</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="header">
        <div class="container header-container">

            <a href="../index.html" class="logo">
                Emygerfson<span>Noticias</span>
            </a>

            <nav class="nav-menu">
                <a href="../index.html">Início</a>
                <a href="sobre.html">Sobre</a>
                <a href="noticias.html">Notícias</a>
                <a href="propostas.html">Propostas</a>
                <a href="comunidade.html">Comunidade</a>
                <a href="contato.html">Contato</a>
            </nav>

        </div>
    </header>

    <main>

        <section class="pagina-banner">
            <div class="container">
                <h1>Notícias de Alumínio</h1>
                <p>
                    Informação local, acontecimentos e assuntos
                    importantes para nossa cidade.
                </p>
            </div>
        </section>

        <section class="secao-noticias container">

            <div class="filtros-noticias">

                <input
                    type="search"
                    id="pesquisaNoticias"
                    placeholder="Pesquisar notícias..."
                >

                <select id="filtroCategoria">
                    <option value="">Todas as categorias</option>
                    <option value="Cidade">Cidade</option>
                    <option value="Política">Política</option>
                    <option value="Comunidade">Comunidade</option>
                    <option value="Esporte">Esporte</option>
                    <option value="Cultura">Cultura</option>
                    <option value="Transparência">Transparência</option>
                </select>

            </div>

            <p id="contadorNoticias" class="contador-noticias">
                Carregando...
            </p>

            <div id="gridNoticias" class="grid-noticias"></div>

            <p id="mensagemVazia" class="mensagem-vazia" hidden>
                Nenhuma notícia encontrada.
            </p>

        </section>

    </main>

    <footer class="footer">
        <div class="container">
            <p>
                © <span id="anoAtual"></span> EmygerfsonNoticias.
                A cidade em pauta. A população em primeiro lugar.
            </p>
        </div>
    </footer>

    <script>
        document.getElementById("anoAtual").textContent =
            new Date().getFullYear();
    </script>

    <script src="../js/noticias.js"></script>

</body>
</html>
